# /etc/nginx/sites-available/rsrbakes  (symlink into sites-enabled)
# Certbot adds the HTTPS (443) block and the http->https redirect for you the first time you run
#   sudo certbot --nginx -d erp.rsrbakes.in
server {
    listen 80;
    listen [::]:80;
    server_name erp.rsrbakes.in;

    # Angular build, uploaded by frontend/deploy/upload.sh
    root /var/www/rsrbakes;
    index index.html;

    # /api/... -> NestJS on localhost:3000 (the /api prefix is stripped)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Hashed JS/CSS can be cached for a long time; index.html must always be re-checked
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # Angular client-side routes
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
